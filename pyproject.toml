[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "project-atlas"
version = "1.0.0"
description = "Read-only scan of every project on your computer, rendered as one offline overview page."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["projects", "inventory", "disk-usage", "git", "dashboard", "offline"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Utilities",
]

[project.scripts]
project-atlas = "project_atlas.__main__:main"

[tool.setuptools]
packages = ["project_atlas"]

[tool.setuptools.package-data]
project_atlas = ["web/*"]
