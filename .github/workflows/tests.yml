name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
        exclude:  # 新版 Ubuntu / macOS 运行器已经没有 Python 3.9，3.9 在 Windows 上测
          - os: macos-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: README numbers match the code
        run: |
          python scripts/check_readme.py
          git diff --exit-code README.md README.en.md
      - name: Smoke run
        run: python -m project_atlas tests -o ci-output --no-recents
      - name: Install as a command
        run: |
          python -m pip install .
          project-atlas --version
